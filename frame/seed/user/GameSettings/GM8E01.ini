# Steam Frame performance overrides (Adreno 750). Lower = faster.
[Video_Settings]
# 3x native (1920x1584 per eye, shown in 2160x2160 eye images). Needs Turnip's direct rendering
# (TU_DEBUG=sysmem, the wrapper's default): the heaviest room measured takes 9 ms of GPU per frame,
# 2x takes 6 ms, 4x 12 ms. With tiled rendering 2x already took 19 ms (52 fps). frame/perf/RESULTS.md.
InternalResolution = 3
# Compile new shaders in the background instead of freezing the game.
ShaderCompilationMode = 3
# GPU texture decoding makes Adreno read bad memory (kernel "gpu fault ... source=BR_SP"),
# crashing SteamVR. PrimedGun's Quest 3 (Adreno 740) build turns it off for the same reason.
EnableGPUTextureDecoding = False
